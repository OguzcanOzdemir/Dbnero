name: Website

# Publishes site/ (the download page) to GitHub Pages.
# One-time setup (needs a repository admin): Settings → Pages → Build and
# deployment → Source: GitHub Actions. Then re-run this workflow.
on:
  push:
    paths:
      - "site/**"
      - "packaging/build_site_images.py"
      - "docs/screenshots/**"
      - "src/dbnero/__init__.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: false
      - name: Assemble site
        run: |
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/dbnero/__init__.py)
          sed -i "s|<span id=\"version\">[^<]*</span>|<span id=\"version\">$version</span>|" site/index.html
          sed -i "s|\"softwareVersion\": \"[^\"]*\"|\"softwareVersion\": \"$version\"|" site/index.html
          sed -i "s|__LASTMOD__|$(date -u +%Y-%m-%d)|g" site/sitemap.xml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Optimise screenshots
        run: |
          pip install --quiet pillow
          python packaging/build_site_images.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
