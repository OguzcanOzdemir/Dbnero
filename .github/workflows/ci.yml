name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,all]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev,all]"
      - run: pytest tests/unit

  integration:
    # Real PostgreSQL / MySQL / SQL Server in Docker; backup -> validate ->
    # restore -> schema/data compare for every engine.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pg: "14", mysql: "8.0" }
          - { pg: "16", mysql: "8.4" }
    env:
      QT_QPA_PLATFORM: offscreen
      PG_VERSION: ${{ matrix.pg }}
      MYSQL_VERSION: ${{ matrix.mysql }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Client tools and ODBC driver
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client mysql-client unixodbc-dev \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18
      - name: Start databases
        run: |
          mkdir -p .mssql-share && chmod 777 .mssql-share
          docker compose -f docker-compose.test.yml up -d --wait
      - run: pip install -e ".[dev,all]"
      - run: pytest tests/integration -ra
      - if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 200
