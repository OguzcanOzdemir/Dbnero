name: Build packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[all]" pyinstaller
      - run: pyinstaller --noconfirm packaging/dbnero.spec
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          QT_QPA_PLATFORM=offscreen timeout 10 ./dist/dbnero/dbnero --no-first-run || [ $? -eq 124 ]
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/dbnero -DestinationPath dbnero-${{ matrix.name }}.zip
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/dbnero.app dbnero-${{ matrix.name }}.zip
      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dbnero-${{ matrix.name }}.tar.gz dbnero
      - uses: actions/upload-artifact@v4
        with:
          name: dbnero-${{ matrix.name }}
          path: dbnero-${{ matrix.name }}.*
