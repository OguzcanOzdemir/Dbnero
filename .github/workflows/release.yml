name: Release

# Builds installers for every platform and publishes them as a GitHub Release.
#
# A release is published when either
#   * the version in src/dbnero/__init__.py changes on the default branch and no
#     tag v<version> exists yet (the tag is created by this workflow), or
#   * a tag like v0.1.0 is pushed, or
#   * the workflow is run manually with a tag name.
# A manual run without a tag only builds the packages.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "src/dbnero/__init__.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0 (empty = build only)"
        required: false
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/dbnero/__init__.py)
          tag=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${INPUT_TAG}"
          elif [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null; then
              echo "v${version} already released; nothing to do"
            else
              tag="v${version}"
            fi
          fi
          build=false
          if [ -n "$tag" ] || [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then build=true; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "version=$version tag=${tag:-none} build=$build"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest, name: macos-arm64 }
          - { os: ubuntu-22.04, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: unixODBC for pyodbc (macOS)
        if: runner.os == 'macOS'
        run: brew install unixodbc
      - run: pip install -e ".[all,packaging]"
      - name: Version
        shell: bash
        run: echo "VERSION=$(python -c 'import dbnero; print(dbnero.__version__)')" >> "$GITHUB_ENV"
      - run: pyinstaller --noconfirm packaging/dbnero.spec

      # Ship pg_dump/pg_restore and mysqldump/mysql inside the app so users do
      # not have to install database client tools themselves.
      - name: Bundle database tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pgBin = $null
          try {
            $versions = Invoke-RestMethod https://www.postgresql.org/versions.json
            $latest = $versions | Where-Object { $_.current -eq $true } | Select-Object -First 1
            $ver = "$($latest.major).$($latest.latestMinor)"
            Invoke-WebRequest "https://get.enterprisedb.com/postgresql/postgresql-$ver-1-windows-x64-binaries.zip" -OutFile pg.zip
            Expand-Archive pg.zip -DestinationPath pgzip
            $pgBin = "pgzip/pgsql/bin"
          } catch {
            Write-Host "EDB download failed ($_); using the runner's PostgreSQL"
            $pgBin = (Get-ChildItem "C:/Program Files/PostgreSQL" -Directory | Sort-Object { [int]$_.Name } | Select-Object -Last 1).FullName + "/bin"
          }
          $mysqlBin = $null
          if (Test-Path "C:/Program Files/MySQL") {
            $mysqlBin = (Get-ChildItem "C:/Program Files/MySQL" -Directory | Where-Object { Test-Path "$($_.FullName)/bin/mysqldump.exe" } | Sort-Object Name | Select-Object -Last 1).FullName + "/bin"
          }
          if (-not $mysqlBin -or -not (Test-Path "$mysqlBin/mysqldump.exe")) {
            choco install mysql --no-progress -y
            $mysqlBin = "C:/tools/mysql/current/bin"
          }
          python packaging/bundle_tools.py dist/dbnero/tools "postgresql=$pgBin" "mysql=$mysqlBin"
          & dist/dbnero/tools/postgresql/bin/pg_dump.exe --version
          & dist/dbnero/tools/postgresql/bin/pg_restore.exe --version
          & dist/dbnero/tools/mysql/bin/mysqldump.exe --version
          & dist/dbnero/tools/mysql/bin/mysql.exe --version

      - name: Bundle database tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq mysql-client dylibbundler
          TOOLS=dist/dbnero.app/Contents/Resources/tools
          python packaging/bundle_tools.py "$TOOLS" \
            "postgresql=$(brew --prefix libpq)/bin" "mysql=$(brew --prefix mysql-client)/bin"
          find "$TOOLS" -type f \( -perm -u+x -o -name '*.dylib' \) -exec codesign --force -s - {} \;
          codesign --force --deep -s - dist/dbnero.app
          for t in postgresql/bin/pg_dump postgresql/bin/pg_restore mysql/bin/mysqldump mysql/bin/mysql; do
            env -u DYLD_LIBRARY_PATH "$TOOLS/$t" --version
          done

      - name: Bundle database tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common patchelf mysql-client
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          PG=$(apt-cache search --names-only '^postgresql-client-[0-9]+$' | awk '{print $1}' | sort -V | tail -1)
          sudo apt-get install -y "$PG"
          PGBIN=/usr/lib/postgresql/${PG##*-}/bin
          python packaging/bundle_tools.py dist/dbnero/tools "postgresql=$PGBIN" mysql=/usr/bin
          for t in postgresql/bin/pg_dump postgresql/bin/pg_restore mysql/bin/mysqldump mysql/bin/mysql; do
            dist/dbnero/tools/$t --version
          done

      - name: Windows installer and portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\dbnero.iss
          Compress-Archive -Path dist/dbnero -DestinationPath out/dbnero-windows-x64-portable.zip

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          mkdir -p out dmg
          cp -R dist/dbnero.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname dbnero -srcfolder dmg -ov -format UDZO out/dbnero-${{ matrix.name }}.dmg

      - name: Linux AppImage and tarball
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libfuse2
          QT_QPA_PLATFORM=offscreen timeout 10 ./dist/dbnero/dbnero --no-first-run || [ $? -eq 124 ]
          mkdir -p out
          packaging/linux/build-appimage.sh out/dbnero-linux-x86_64.AppImage
          tar -C dist -czf out/dbnero-linux-x86_64.tar.gz dbnero

      - uses: actions/upload-artifact@v4
        with:
          name: dbnero-${{ matrix.name }}
          path: out/*

  publish:
    needs: [plan, build]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: dbnero ${{ needs.plan.outputs.tag }}
          files: out/*
          generate_release_notes: true
          body: |
            Free download for Windows, macOS and Linux. See the [download page](https://oguzcanozdemir.github.io/Dbnero/) for which file to pick.

            dbnero uses each database's own client tools (pg_dump, mysqldump, the SQL Server ODBC driver); install the ones you need. The app checks them on first start.

            The builds are not code-signed yet: on Windows choose "More info → Run anyway", on macOS right-click the app and choose Open the first time.
