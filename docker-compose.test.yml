# Test databases for `pytest tests/integration`.
#   docker compose -f docker-compose.test.yml up -d
# Credentials here are for throwaway local test containers only.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: Pg_Test_123
    ports: ["55432:5432"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: My_Test_123
      MYSQL_USER: dbnero
      MYSQL_PASSWORD: My_Test_123
    command: ["--log-bin-trust-function-creators=1"]
    ports: ["53306:3306"]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Mssql_Test_123!
    ports: ["51433:1433"]
    volumes:
      # Shared backup directory: the server sees /var/opt/mssql/dbnero-share,
      # tests see ./.mssql-share (set DBNERO_IT_MSSQL_LOCAL_DIR accordingly).
      - ./.mssql-share:/var/opt/mssql/dbnero-share
